[package]
name = "salsa-gui"
description = "Salsa Studio object-audio preview player"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.33"
gstreamer = "0.24"
objectaudio-ir = { path = "../../libs/audio/objectaudio-ir" }
objectaudio-meta = { path = "../../libs/gst/objectaudio-meta" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
gstreamer-app = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
