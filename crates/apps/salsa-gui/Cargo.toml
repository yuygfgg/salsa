[package]
name = "salsa-gui"
description = "Salsa Studio object-audio preview player"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.33"
gstreamer.workspace = true
objectaudio-ir.workspace = true
objectaudio-meta.workspace = true
objectaudio-render.workspace = true
rfd = "0.15"
salsa-codec.workspace = true
salsa-gst.workspace = true
salsa-gst-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
gstreamer-app.workspace = true
