[package]
name = "salsa-audiod"
description = "Virtual IEC 61937 audio service: carrier depacketize, Salsa decode/render, bounded output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "salsa_audiod"
path = "src/lib.rs"

[[bin]]
name = "salsa-audiod"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-audio.workspace = true
iec61937.workspace = true
libc.workspace = true
log.workspace = true
objectaudio-hrtf.workspace = true
salsa-codec.workspace = true
salsa-gst.workspace = true
salsa-gst-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
