[workspace]
resolver = "3"
members = [
    "crates/libs/core/salsa-codec",
    "crates/libs/core/salsa-bitstream",
    "crates/libs/gst/salsa-gst",
    "crates/libs/gst/salsa-gst-registry",
    "crates/libs/audio/objectaudio-ir",
    "crates/libs/audio/objectaudio-oamd",
    "crates/libs/decoder/eac3joc/eac3joc",
    "crates/libs/decoder/eac3joc/core-decoder",
    "crates/libs/decoder/eac3joc/eac3joc-dsp",
    "crates/libs/decoder/truehd/truehd-atmos",
    "crates/libs/gst/objectaudio-meta",
    "crates/libs/gst/objectaudio-decode",
    "crates/libs/io/iec61937",
    "crates/libs/io/objectaudio-damf",
    "crates/libs/render/objectaudio-render",
    "crates/libs/render/hrtf",
    "crates/gst-plugins/gst-eac3joc",
    "crates/gst-plugins/gst-truehd",
    "crates/gst-plugins/gst-objectaudio",
    "crates/gst-plugins/gst-damf",
    "crates/libs/encoder/eac3joc-encoder",
    "crates/libs/encoder/atmos-cluster",
    "crates/apps/salsa-eac3joc-encode",
    "crates/apps/salsa-cluster",
    "crates/apps/salsa-audiod",
    "crates/apps/salsa-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
salsa-codec = { path = "crates/libs/core/salsa-codec" }
salsa-bitstream = { path = "crates/libs/core/salsa-bitstream" }
salsa-gst = { path = "crates/libs/gst/salsa-gst" }
salsa-gst-registry = { path = "crates/libs/gst/salsa-gst-registry" }
objectaudio-ir = { path = "crates/libs/audio/objectaudio-ir" }
eac3joc-encoder = { path = "crates/libs/encoder/eac3joc-encoder" }
atmos-cluster = { path = "crates/libs/encoder/atmos-cluster" }
objectaudio-oamd = { path = "crates/libs/audio/objectaudio-oamd" }
objectaudio-meta = { path = "crates/libs/gst/objectaudio-meta" }
objectaudio-decode = { path = "crates/libs/gst/objectaudio-decode" }
iec61937 = { path = "crates/libs/io/iec61937" }
objectaudio-damf = { path = "crates/libs/io/objectaudio-damf" }
objectaudio-render = { path = "crates/libs/render/objectaudio-render" }
objectaudio-hrtf = { path = "crates/libs/render/hrtf" }
eac3joc = { path = "crates/libs/decoder/eac3joc/eac3joc" }
eac3joc-core-decoder = { path = "crates/libs/decoder/eac3joc/core-decoder" }
eac3joc-dsp = { path = "crates/libs/decoder/eac3joc/eac3joc-dsp" }
truehd-atmos = { path = "crates/libs/decoder/truehd/truehd-atmos" }
truehd = "0.7"
anyhow = "1"
libc = "0.2"
thiserror = "2"
proptest = "1"
rustfft = "6"
num-complex = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
gstreamer = "0.24"
gstreamer-base = "0.24"
gstreamer-audio = { version = "0.24", features = ["v1_18"] }
gstreamer-app = "0.24"
